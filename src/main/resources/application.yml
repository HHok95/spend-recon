spring:
  application:
    name: spend-recon
  datasource:
    url: jdbc:postgresql://localhost:5432/spendrecon
    username: spendrecon
    password: spendrecon
    hikari:
      # Each in-flight write holds one connection until its idempotency row commits.
      maximum-pool-size: 20
  mvc:
    problemdetails:
      enabled: true
  jpa:
    # Flyway owns the schema. Hibernate only checks that it matches the entities.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

# Scalar's default document is a public demo. Point it at the spec springdoc generates.
scalar:
  url: /v3/api-docs
  path: /scalar
  page-title: spend-recon

# Local default, same idea as the database password in docker-compose.yml.
# It lives on the non-prod document below so the prod profile cannot fall back to it.
recon:
  idempotency:
    # A second request waits this long for the first transaction to store its response.
    # If the wait expires, the response is 409 and Retry-After is retry-after.
    lock-timeout: 5s
    retry-after: 1s
  auto-approve:
    # A MATCHED score at or above this value is approved in the same transaction.
    # Quoted so YAML does not turn it into a binary float. Above 1 disables auto-approve.
    threshold: "0.95"
  exception:
    # A currency or amount miss holds the receipt only when Jaro-Winkler on
    # merchant_norm is at least this value. Quoted so YAML keeps it decimal.
    min-merchant-score: "0.60"
  outbox:
    # Publishes MatchConfirmed rows. Tests turn this off and call the publisher themselves.
    enabled: true
    poll-interval: 1s
    batch-size: 50

---
spring:
  config:
    activate:
      on-profile: "!prod"
recon:
  api-key: local-dev-key
