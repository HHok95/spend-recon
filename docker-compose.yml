services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendrecon
      POSTGRES_USER: spendrecon
      POSTGRES_PASSWORD: spendrecon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendrecon -d spendrecon"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spendrecon
      SPRING_DATASOURCE_USERNAME: spendrecon
      SPRING_DATASOURCE_PASSWORD: spendrecon
      RECON_API_KEY: local-dev-key
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.16.0
    depends_on:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.6
    depends_on:
      - prometheus
    # admin/admin is for this local Compose stack only. Do not reuse it elsewhere.
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
