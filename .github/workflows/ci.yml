name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - name: Require Docker
        run: |
          if ! docker info; then
            echo "Docker must be running on the self-hosted runner."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check kind cluster ownership guards
        run: ./scripts/kind-ownership-check.sh
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$PWD/k8s:/k8s:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -strict \
            -summary \
            -kubernetes-version 1.32.0 \
            -skip Kustomization \
            /k8s
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon
