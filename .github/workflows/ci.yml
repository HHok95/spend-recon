name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - name: Require Docker
        run: |
          if ! docker info; then
            echo "Docker must be running on the self-hosted runner."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon
