name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'HHok95/spend-recon' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 20
    steps:
      - name: Confirm CI succeeded for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="${{ github.sha }}"
          conclusion="$(gh run list --workflow CI --branch "${{ github.ref_name }}" --json headSha,conclusion --jq "map(select(.headSha == \"$sha\")) | .[0].conclusion // \"none\"")"
          if [ "$conclusion" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::CI has not succeeded for ${sha} (conclusion: ${conclusion})."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the commit CI ran
        if: steps.ci.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip when FLY_API_TOKEN is absent
        id: fly_token
        if: steps.ci.outputs.ok == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice title=Deploy skipped::FLY_API_TOKEN is not set, so this job does not deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flyctl
        if: steps.ci.outputs.ok == 'true' && steps.fly_token.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy
        if: steps.ci.outputs.ok == 'true' && steps.fly_token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false
