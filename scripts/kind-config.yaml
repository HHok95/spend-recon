# Local kind cluster for spend-recon.
# Requires kind 0.24.0 or newer. That release's default node is Kubernetes 1.31,
# where nftables kube-proxy runs without a feature gate.
# nftables kube-proxy does not need the kernel xt_statistic match. The iptables
# proxy does, and a kernel without that match installs no Service rules.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  kubeProxyMode: nftables
